project_name: tau-cli
release:
  github:
    owner: taubyte
    name: tau-cli

  draft: false
  replace_existing_draft: false
  prerelease: auto

  name_template: ""
  disable: false
  skip_upload: false

builds:
  - id: "windows"
    main: "./tools/tau/main.go"
    binary: "tau"
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
      - GOAMD64=v2
    tags:
      - windows

changelog:
  disable: true

checksum:
  disable: true

archives:
  - files:
      - none*
